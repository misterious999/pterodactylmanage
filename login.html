<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentikasi Sistem - Zeroix Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #0d9488; --primary-hover: #0f766e; --primary-glow: rgba(13, 148, 136, 0.4);
            --danger: #ef4444; --bg-dark: #070b14; 
            --card-bg: rgba(15, 23, 42, 0.5); 
            --text-main: #ffffff; --text-sub: #94a3b8; 
            --border: rgba(255, 255, 255, 0.1); 
        }
        
        body { 
            font-family: 'Inter', sans-serif; color: var(--text-main); margin: 0; 
            padding: 20px; box-sizing: border-box; /* Tambahan ruang napas biar gak mentok layar */
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden; 
            position: relative;
        }

        /* --- AMBIENT BACKGROUND GLOW --- */
        .ambient-blob-1 {
            position: absolute; width: 400px; height: 400px;
            background: rgba(13, 148, 136, 0.3); border-radius: 50%;
            top: -10%; left: -10%; filter: blur(100px);
            animation: floatBlob 10s infinite alternate ease-in-out;
            z-index: 0; pointer-events: none;
        }
        .ambient-blob-2 {
            position: absolute; width: 300px; height: 300px;
            background: rgba(5, 150, 105, 0.2); border-radius: 50%;
            bottom: -10%; right: -10%; filter: blur(80px);
            animation: floatBlob 12s infinite alternate-reverse ease-in-out;
            z-index: 0; pointer-events: none;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* --- PREMIUM GLASS CARD --- */
        .login-box {
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 30px; border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(13, 148, 136, 0.05); 
            width: 100%; max-width: 380px; text-align: center; z-index: 1;
            box-sizing: border-box; /* Memastikan padding tidak merusak width 100% */
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-logo {
            width: 68px; height: 68px; margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.2), rgba(15, 23, 42, 0.8)); 
            border-radius: 20px;
            border: 1px solid rgba(13, 148, 136, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 10px rgba(13, 148, 136, 0.3);
        }
        
        .brand-logo svg { width: 34px; height: 34px; fill: var(--primary); filter: drop-shadow(0 0 5px var(--primary));}

        .login-box h2 { 
            margin: 0 0 8px 0; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; 
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box p { color: var(--text-sub); font-size: 13px; margin-bottom: 35px; line-height: 1.6; }
        
        .input-group { text-align: left; margin-bottom: 22px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-group input { 
            width: 100%; padding: 14px 16px; 
            background: rgba(0, 0, 0, 0.25); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; color: var(--text-main); font-size: 14px; 
            box-sizing: border-box; outline: none; transition: all 0.3s ease; 
            font-family: 'Inter', sans-serif;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .input-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15), inset 0 2px 4px rgba(0,0,0,0.2); 
            background: rgba(15, 23, 42, 0.6); 
        }

        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 45px; } 
        .btn-eye { position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-sub); display: flex; align-items: center; justify-content: center; padding: 0; transition: 0.3s; }
        .btn-eye:hover { color: var(--text-main); transform: scale(1.1); }
        .btn-eye svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- PREMIUM BUTTON DENGAN EFEK SHIMMER --- */
        .btn-submit { 
            position: relative; overflow: hidden;
            width: 100%; padding: 15px; 
            background: linear-gradient(135deg, #0d9488 0%, #059669 100%); 
            color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; 
            cursor: pointer; transition: all 0.3s ease; margin-top: 10px; display: flex; 
            justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.4), inset 0 1px 1px rgba(255,255,255,0.2);
        }
        
        /* Efek Shimmer (Cahaya Lewat) */
        .btn-submit::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: 0.5s ease;
        }

        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 35px rgba(13, 148, 136, 0.5), inset 0 1px 1px rgba(255,255,255,0.3); 
        }
        
        .btn-submit:hover::after { left: 150%; }

        .btn-submit svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.3s ease; }
        .btn-submit:hover svg { transform: translateX(4px); }

        /* --- System Modal --- */
        .system-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 11, 20, 0.85); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; animation: fadeInPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .system-modal-popup { background: var(--card-bg); border-radius: 24px; width: 100%; max-width: 350px; padding: 35px 30px; text-align: center; color: var(--text-main); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.6); backdrop-filter: blur(25px); }
        
        .modal-icon-top { width: 60px; height: 60px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); }
        .modal-icon-top svg { width: 28px; height: 28px; fill: var(--danger); filter: drop-shadow(0 0 5px var(--danger));}
        
        .system-modal-header { font-size: 18px; font-weight: 800; color: var(--danger); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .system-modal-body { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-bottom: 25px; }
        
        .btn-close-modal { width: 100%; background: var(--danger); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3); }
        .btn-close-modal:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(239, 68, 68, 0.4); }

        @keyframes fadeInPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>

    <div class="login-box">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        
        <h2>Zeroix Enterprise</h2>
        <p>Autentikasi identitas untuk akses Control Center</p>
        
        <div class="input-group">
            <label>Identitas Pengguna</label>
            <input type="text" id="username" placeholder="Masukkan username..." autocomplete="off" required>
        </div>
        
        <div class="input-group">
            <label>Kata Sandi</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Masukkan kata sandi..." required>
                <button type="button" class="btn-eye" id="togglePassword" tabindex="-1">
                    <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
                </button>
            </div>
        </div>
        
        <button onclick="prosesLogin()" id="btnLogin" class="btn-submit">
            <span>Otorisasi Akses</span>
            <svg viewBox="0 0 24 24"><path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6a.996.996 0 10-1.41 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/></svg>
        </button>
    </div>

    <!-- Modal Error Sistem -->
    <div id="modalLoginError" class="system-modal-overlay">
        <div class="system-modal-popup">
            <div class="modal-icon-top">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <div class="system-modal-header">Otorisasi Ditolak</div>
            <div class="system-modal-body" id="errorMsgText">Kredensial tidak valid.</div>
            <button class="btn-close-modal" onclick="tutupError()">Mengerti</button>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        
        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            const newType = isPassword ? 'text' : 'password';
            passwordInput.setAttribute('type', newType);
            
            if (newType === 'text') {
                eyeIcon.innerHTML = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
            } else {
                eyeIcon.innerHTML = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>`;
            }
        });

        const firebaseConfig = { databaseURL: GlobalConfig.getFirebaseUrl() };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); } 
        const database = firebase.database();
        
        database.ref('users').once('value').then((snapshot) => {
            if (!snapshot.exists()) {
                database.ref('users/user_001').set({
                    username: "admin",
                    usernameLower: "admin",
                    password: "pstar7@123",
                    role: "pemilik",
                    maker: "system",
                    isOnline: false,
                    profilePic: "",
                    timestamp: Date.now(),
                    createdAt: Date.now(),
                    lastLoginAt: 0,
                    expiredStatus: "exempt"
                });
            }
        }).catch(() => {
            console.warn("Koneksi database tertunda saat inisialisasi.");
        });

        function tampilkanError(pesan) {
            document.getElementById('errorMsgText').innerText = pesan;
            document.getElementById('modalLoginError').style.display = 'flex';
        }
        function tutupError() {
            document.getElementById('modalLoginError').style.display = 'none';
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') prosesLogin();
        });
        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        function prosesLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');
            
            const defaultBtn = `<span>Otorisasi Akses</span> <svg viewBox="0 0 24 24"><path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6a.996.996 0 10-1.41 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/></svg>`;

            if (!userIn || !passIn) {
                tampilkanError("Validasi gagal: Identitas dan kata sandi wajib diisi.");
                return;
            }

            btn.innerHTML = `<span>Memverifikasi...</span> <svg viewBox="0 0 24 24" style="animation: spin 1s linear infinite; width:18px; fill:currentColor;"><path d="M12 4V2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
            btn.style.opacity = "0.7";
            btn.style.pointerEvents = "none";

            database.ref('users').once('value').then((snapshot) => {
                const users = snapshot.val() || {};
                let matchedId = null;
                let matchedUser = null;

                Object.keys(users).some((id) => {
                    const u = users[id] || {};
                    const dbUsername = String(u.username || '').trim().toLowerCase();
                    const dbPassword = String(u.password || '');
                    if (dbUsername === userIn.toLowerCase() && dbPassword === passIn) {
                        matchedId = id;
                        matchedUser = u;
                        return true;
                    }
                    return false;
                });

                if (!matchedId || !matchedUser) {
                    tampilkanError("Otorisasi ditolak: Kredensial yang dimasukkan tidak valid.");
                    btn.innerHTML = defaultBtn;
                    btn.style.opacity = "1";
                    btn.style.pointerEvents = "auto";
                    return;
                }

                const role = String(matchedUser.role || 'reseller_public').trim().toLowerCase();
                const username = matchedUser.username || userIn;

                function resetLoginButton() {
                    btn.innerHTML = defaultBtn;
                    btn.style.opacity = "1";
                    btn.style.pointerEvents = "auto";
                }

                function lanjutLogin() {
                    localStorage.setItem('panel_user_id', matchedId);
                    localStorage.setItem('user_id', matchedId);
                    localStorage.setItem('user_id_ptero', matchedId);
                    localStorage.setItem('panel_username', username);
                    localStorage.setItem('username', username);
                    localStorage.setItem('panel_role', role);
                    localStorage.setItem('role', role);
                    localStorage.setItem('panel_password', passIn);
                    if (matchedUser.ptero_id) localStorage.setItem('ptero_user_id', matchedUser.ptero_id);

                    const now = Date.now();
                    return database.ref('users/' + matchedId).update({
                        isOnline: true,
                        lastLoginAt: now,
                        usernameLower: String(username).toLowerCase()
                    }).then(() => database.ref('activity_logs').push({
                        uid: matchedId,
                        username,
                        role,
                        action: "Otorisasi berhasil. Masuk ke dalam Control Center.",
                        timestamp: now
                    })).then(() => {
                        window.location.replace("index.html");
                    });
                }

                if (role === 'pemilik') {
                    return lanjutLogin();
                }

                const expiredAt = Number(matchedUser.expiredAt || 0);
                if (!expiredAt) {
                    tampilkanError(`Akses ditangguhkan. Akun ${username} belum mendapat otorisasi lisensi dari Administrator.`);
                    resetLoginButton();
                    return null;
                }

                if (expiredAt <= Date.now()) {
                    tampilkanError(`Lisensi habis. Masa berlaku akun ${username} telah berakhir.`);
                    resetLoginButton();
                    return null;
                }

                return lanjutLogin();
            }).catch((error) => {
                tampilkanError("Koneksi ke pangkalan data terputus. Periksa jaringan Anda.");
                console.error(error);
                btn.innerHTML = defaultBtn;
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            });
        }
    </script>
</body>
</html>
