<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login Panel &amp; Control Center — ZeroixDark</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root { 
            --bg: #060b1a;
            --card: rgba(255, 255, 255, 0.04); 
            --card-hover: rgba(255, 255, 255, 0.07);
            --card-solid: #0d1527;
            --line: rgba(255, 255, 255, 0.09);
            --line-hover: rgba(94, 234, 212, 0.4);
            --ink: #e9eeff;
            --muted: #8d97b8;
            --a1: #5eead4;
            --a2: #818cf8;
            --a3: #f472b6;
            --primary: #5eead4;
            --primary-glow: rgba(94, 234, 212, 0.35);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* --- AURORA FLOATING AMBIENCE (contoh.html) --- */
        .aurora {
            position: fixed; inset: -20%; z-index: -2;
            filter: blur(80px) saturate(140%);
            opacity: .55; pointer-events: none;
        }
        .aurora span {
            position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
            mix-blend-mode: screen; animation: drift 22s ease-in-out infinite alternate;
        }
        .aurora span:nth-child(1) { background: radial-gradient(circle, var(--a1), transparent 60%); top: 0; left: 10%; }
        .aurora span:nth-child(2) { background: radial-gradient(circle, var(--a2), transparent 60%); top: 20%; right: 0; animation-delay: -8s; }
        .aurora span:nth-child(3) { background: radial-gradient(circle, var(--a3), transparent 60%); bottom: 0; left: 30%; animation-delay: -14s; opacity: .6; }
        @keyframes drift { to { transform: translate(12vmax, -8vmax) rotate(40deg) scale(1.2); } }

        /* --- GRID GRAIN BACKGROUND (contoh.html) --- */
        .grain {
            position: fixed; inset: 0; z-index: -1;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 30%, #000, transparent 75%);
            pointer-events: none;
        }

        /* --- TOMBOL KEMBALI KE BERANDA --- */
        .btn-back-home {
            position: fixed;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .btn-back-home:hover {
            color: var(--a1);
            border-color: rgba(94, 234, 212, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(94, 234, 212, 0.15);
        }

        /* --- PREMIUM GLASS CARD --- */
        .login-box {
            background: var(--card); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            padding: 38px 32px;
            border-radius: 26px; 
            border: 1px solid var(--line);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 35px rgba(94, 234, 212, 0.08); 
            width: 100%;
            max-width: 410px;
            text-align: center;
            z-index: 1;
            animation: fadeIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 25px rgba(94, 234, 212, 0.35));
            transition: transform 0.3s ease;
        }
        .brand-logo:hover {
            transform: rotate(6deg) scale(1.05);
        }
        .brand-logo svg {
            width: 70px;
            height: 70px;
        }

        .brand-title {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
            color: var(--ink);
        }
        .brand-title b {
            color: var(--a1);
        }

        .login-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 30px;
            background: rgba(94, 234, 212, 0.1);
            border: 1px solid rgba(94, 234, 212, 0.25);
            color: var(--a1);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 24px;
        }

        .login-desc {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        
        .input-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }
        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .input-group label i {
            color: var(--a1);
            font-size: 14px;
        }
        
        .input-group input { 
            width: 100%;
            padding: 13px 16px; 
            background: rgba(0, 0, 0, 0.35); 
            border: 1px solid var(--line); 
            border-radius: 12px;
            color: var(--ink);
            font-family: 'Sora', sans-serif;
            font-size: 14px; 
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease; 
        }
        
        .input-group input:focus { 
            border-color: var(--a1); 
            box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.15); 
            background: rgba(13, 21, 39, 0.8); 
        }

        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 48px; } 
        .btn-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 8px;
            transition: 0.25s;
            font-size: 18px;
        }
        .btn-eye:hover { color: var(--a1); background: rgba(255, 255, 255, 0.05); }

        /* --- PREMIUM BUTTON DENGAN EFEK SHIMMER --- */
        .btn-submit { 
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 14px 20px; 
            background: linear-gradient(135deg, var(--a1) 0%, var(--a2) 100%); 
            color: #060b1a;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800; 
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex; 
            justify-content: center;
            align-items: center;
            gap: 9px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            box-shadow: 0 10px 30px rgba(94, 234, 212, 0.35);
        }
        
        /* Efek Shimmer */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: 0.5s ease;
        }

        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 14px 40px rgba(94, 234, 212, 0.5); 
            filter: brightness(1.06);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:hover::after { left: 150%; }

        .btn-submit i { font-size: 18px; transition: transform 0.3s ease; }
        .btn-submit:hover i { transform: translateX(3px); }

        .login-footer-info {
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        .login-footer-info a {
            color: var(--a1);
            text-decoration: underline;
        }

        /* --- System Modal --- */
        .system-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 7, 18, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .system-modal-popup {
            background: rgba(13, 21, 39, 0.95);
            border-radius: 24px;
            width: 100%;
            max-width: 370px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 32px 26px;
            text-align: center;
            color: var(--ink);
            border: 1px solid var(--line);
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 35px rgba(239, 68, 68, 0.15);
        }
        
        .modal-icon-top {
            width: 58px; height: 58px;
            margin: 0 auto 18px auto;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
            font-size: 26px;
            color: var(--danger);
        }
        
        .system-modal-header {
            font-size: 17px;
            font-weight: 800;
            color: var(--danger);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .system-modal-body {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-wrap;
        }
        
        .btn-close-modal {
            width: 100%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }
        .btn-close-modal:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(239, 68, 68, 0.45);
        }

        body.lite-mode .aurora, body.lite-mode .grain { display: none !important; }
        body.lite-mode * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        body.lite-mode .login-box, body.lite-mode .system-modal-popup { background: var(--card-solid) !important; }

        @media (max-width: 480px) {
            .btn-back-home { top: 16px; left: 16px; padding: 7px 12px; font-size: 12px; }
            .login-box { padding: 32px 22px; border-radius: 22px; }
        }

        @keyframes fadeInPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Ambient Aurora Background Elements (contoh.html) -->
    <div class="aurora"><span></span><span></span><span></span></div>
    <div class="grain"></div>

    <script src="page-loader.js?v=75"></script>

    <!-- Tombol Navigasi ke Beranda -->
    <a href="/" class="btn-back-home" title="Kembali ke Beranda">
        <i class="ri-arrow-left-line"></i>
        <span>Beranda</span>
    </a>

    <div class="login-box">
        <div class="brand-logo">
            <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="zxLogBg" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#0c152c"/><stop offset="100%" stop-color="#050a16"/></linearGradient>
                    <linearGradient id="zxLogBrd" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#5eead4"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
                    <linearGradient id="zxLogTop" x1="16" y1="17" x2="47" y2="38"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
                    <linearGradient id="zxLogBot" x1="17" y1="26" x2="48" y2="47"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
                </defs>
                <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#zxLogBg)" stroke="url(#zxLogBrd)" stroke-width="1.6"/>
                <path d="M 19 17.5 H 43 C 45.8 17.5 47.8 19.5 47.2 22.3 L 31.2 38.3 C 30.5 39 29.5 39.4 28.5 39.4 H 24.5 C 23.3 39.4 22.6 38.1 23.3 37.1 L 37.8 24.5 H 19 C 17.3 24.5 16 23.2 16 21.5 V 20.5 C 16 18.8 17.3 17.5 19 17.5 Z" fill="url(#zxLogTop)"/>
                <path d="M 45 46.5 H 21 C 18.2 46.5 16.2 44.5 16.8 41.7 L 32.8 25.7 C 33.5 25 34.5 24.6 35.5 24.6 H 39.5 C 40.7 24.6 41.4 25.9 40.7 26.9 L 26.2 39.5 H 45 C 46.7 39.5 48 40.8 48 42.5 V 43.5 C 48 45.2 46.7 46.5 45 46.5 Z" fill="url(#zxLogBot)"/>
                <circle cx="32" cy="32" r="2.2" fill="#fff"/>
            </svg>
        </div>
        
        <h1 class="brand-title">Zeroix<b>Dark</b></h1>
        <div class="login-pill"><i class="ri-shield-keyhole-line"></i> Control Center</div>
        <p class="login-desc">Autentikasi identitas untuk akses manajemen panel dan server</p>
        
        <div class="input-group">
            <label><i class="ri-user-3-line"></i> Identitas Pengguna</label>
            <input type="text" id="username" placeholder="Masukkan username..." autocomplete="off" required>
        </div>
        
        <div class="input-group">
            <label><i class="ri-lock-password-line"></i> Kata Sandi</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Masukkan kata sandi..." required>
                <button type="button" class="btn-eye" id="togglePassword" tabindex="-1" title="Lihat/Sembunyikan password">
                    <i class="ri-eye-off-line" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        
        <button onclick="prosesLogin()" id="btnLogin" class="btn-submit">
            <span>Otorisasi Akses</span>
            <i class="ri-arrow-right-line"></i>
        </button>

        <div class="login-footer-info">
            Belum punya panel? <a href="/store">Beli langsung via QRIS</a>
        </div>
    </div>

    <!-- Modal Error Sistem -->
    <div id="modalLoginError" class="system-modal-overlay">
        <div class="system-modal-popup">
            <div class="modal-icon-top">
                <i class="ri-error-warning-line"></i>
            </div>
            <div class="system-modal-header">Otorisasi Ditolak</div>
            <div class="system-modal-body" id="errorMsgText">Kredensial tidak valid.</div>
            <button class="btn-close-modal" onclick="tutupError()">Mengerti</button>
        </div>
    </div>
    
    <script>try { if (localStorage.getItem('lite_mode') === 'true') document.body.classList.add('lite-mode'); } catch (e) {}</script>
    <script src="config.js?v=75"></script>
    <script src="db-bridge.js?v=75"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        
        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            const newType = isPassword ? 'text' : 'password';
            passwordInput.setAttribute('type', newType);
            
            if (newType === 'text') {
                eyeIcon.className = 'ri-eye-line';
            } else {
                eyeIcon.className = 'ri-eye-off-line';
            }
        });

        // Login diverifikasi di Worker; password disimpan dalam bentuk hash PBKDF2.
        // Bukan lagi membaca seluruh tabel users dari browser (celah lama yang dipakai hacker).
        function tampilkanError(pesan, judul) {
            document.getElementById('errorMsgText').innerText = pesan;
            var headerEl = document.querySelector('#modalLoginError .system-modal-header');
            if (headerEl) headerEl.innerText = judul || "Otorisasi Ditolak";
            document.getElementById('modalLoginError').style.display = 'flex';
        }
        function tutupError() {
            document.getElementById('modalLoginError').style.display = 'none';
            var headerEl = document.querySelector('#modalLoginError .system-modal-header');
            if (headerEl) headerEl.innerText = "Otorisasi Ditolak";
        }

        // Cek apakah user terpental karena sesi berakhir (keluar browser/tab >= 5 jam)
        function checkZeroixKickReason() {
            try {
                var reason = sessionStorage.getItem('zeroix_kick_reason') || localStorage.getItem('zeroix_kick_reason');
                if (reason === 'timeout_5h') {
                    try { sessionStorage.removeItem('zeroix_kick_reason'); } catch (e) {}
                    try { localStorage.removeItem('zeroix_kick_reason'); } catch (e) {}
                    tampilkanError(
                        "Waktu sesi berakhir: Anda telah keluar dari browser/tab atau tidak ada aktivitas selama lebih dari 5 jam.\n\nDemi keamanan akun, silakan masuk (login) kembali.",
                        "SESI KEDALUWARSA (5 JAM)"
                    );
                }
            } catch (e) {}
        }
        window.checkZeroixKickReason = checkZeroixKickReason;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkZeroixKickReason);
        } else {
            checkZeroixKickReason();
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') prosesLogin();
        });
        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        // Data user tidak lagi dibaca langsung dari database di sini.
        // Login diverifikasi di Worker (hash PBKDF2 di sisi server).
        function prosesLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');

            const defaultBtn = `<span>Otorisasi Akses</span> <i class="ri-arrow-right-line"></i>`;

            if (typeof AuthBridge === 'undefined') {
                tampilkanError("Sistem sedang diperbarui. Muat ulang halaman (refresh) lalu coba lagi.");
                return;
            }

            if (!userIn || !passIn) {
                tampilkanError("Validasi gagal: Identitas dan kata sandi wajib diisi.");
                return;
            }

            btn.innerHTML = `<span>Memverifikasi...</span> <i class="ri-loader-4-line ri-spin"></i>`;
            btn.style.opacity = "0.7";
            btn.style.pointerEvents = "none";

            // Verifikasi lewat Worker. Password tidak pernah disimpan di browser.
            let loginPromise;
            try { loginPromise = AuthBridge.login(userIn, passIn); }
            catch (e) { loginPromise = Promise.reject(e); }
            if (!loginPromise) loginPromise = Promise.reject(new Error("Sistem belum siap. Muat ulang halaman."));
            loginPromise.then((user) => {
                const nama = String(user.username || userIn);
                const peran = String(user.role || '').toLowerCase();
                localStorage.setItem('panel_user_id', user.uid);
                localStorage.setItem('user_id', user.uid);
                localStorage.setItem('user_id_ptero', user.uid);
                localStorage.setItem('panel_username', nama);
                localStorage.setItem('username', nama);
                localStorage.setItem('panel_role', peran);
                localStorage.setItem('role', peran);
                if (user.ptero_id) localStorage.setItem('ptero_user_id', user.ptero_id);
                try {
                    localStorage.setItem('zeroix_last_active', String(Date.now()));
                    sessionStorage.removeItem('zeroix_kick_reason');
                    localStorage.removeItem('zeroix_kick_reason');
                } catch (e) {}
                window.location.replace("dashboard.html");
            }).catch((error) => {
                tampilkanError(error.message || "Otorisasi ditolak: Kredensial yang dimasukkan tidak valid.");
                btn.innerHTML = defaultBtn;
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            });
        }
    </script>
</body>
</html>
