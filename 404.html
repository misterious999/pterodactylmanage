<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#060b1a">
    <title>404 — Halaman Tidak Ditemukan | ZeroixDark</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9.4">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=9.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg: #060b1a;
            --card: rgba(255, 255, 255, 0.04);
            --line: rgba(255, 255, 255, 0.09);
            --ink: #e9eeff;
            --muted: #8d97b8;
            --a1: #5eead4;
            --a2: #818cf8;
            --a3: #f472b6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }
        .aurora { position: fixed; inset: -20%; z-index: -2; filter: blur(80px) saturate(140%); opacity: .55; pointer-events: none; }
        .aurora span { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; mix-blend-mode: screen; animation: drift 22s ease-in-out infinite alternate; }
        .aurora span:nth-child(1) { background: radial-gradient(circle, var(--a1), transparent 60%); top: 0; left: 10%; }
        .aurora span:nth-child(2) { background: radial-gradient(circle, var(--a2), transparent 60%); top: 20%; right: 0; animation-delay: -8s; }
        .aurora span:nth-child(3) { background: radial-gradient(circle, var(--a3), transparent 60%); bottom: 0; left: 30%; animation-delay: -14s; opacity: .6; }
        @keyframes drift { to { transform: translate(12vmax, -8vmax) rotate(40deg) scale(1.2); } }
        .grain {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 35%, #000, transparent 75%);
        }
        .box {
            max-width: 520px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 42px 30px;
            text-align: center;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65);
        }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3.6rem, 11vw, 5.4rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 14px;
            background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
        p { color: var(--muted); font-size: .92rem; line-height: 1.65; margin-bottom: 26px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 18px; border-radius: 12px;
            font-size: .88rem; font-weight: 700; text-decoration: none;
            border: 1px solid var(--line); background: var(--card); color: var(--ink);
            transition: .25s ease;
        }
        .btn:hover { border-color: var(--a1); color: var(--a1); transform: translateY(-2px); }
        .btn.primary {
            background: linear-gradient(135deg, var(--a1), var(--a2));
            color: #060b1a; border: 0;
            box-shadow: 0 10px 28px rgba(94, 234, 212, .28);
        }
        .btn.primary:hover { color: #060b1a; filter: brightness(1.06); }
    </style>
</head>
<body>
    <div class="aurora"><span></span><span></span><span></span></div>
    <div class="grain"></div>
    <main class="box">
        <div class="code">404</div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Rute yang kamu tuju tidak tersedia, sudah dipindahkan, atau bersifat terbatas. Pilih tujuan yang tersedia di bawah ini.</p>
        <div class="actions">
            <a href="/" class="btn primary"><i class="ri-home-5-line"></i> Beranda</a>
            <a href="/store" class="btn"><i class="ri-shopping-bag-3-line"></i> Toko Layanan</a>
            <a href="/status" class="btn"><i class="ri-pulse-line"></i> Status Node</a>
            <a href="/login" class="btn"><i class="ri-shield-keyhole-line"></i> Login Panel</a>
        </div>
    </main>
</body>
</html>
