<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Audit Sistem - Zeroix Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-solid: #1e293b;
            --primary: #0d9488; --primary-glow: rgba(13, 148, 136, 0.2);
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --text-main: #f8fafc; --text-sub: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.25); --border-color: rgba(255,255,255,0.08);
        }

        /* --- LITE MODE (ANTI-LAG) --- */
        body.lite-mode .ambient-blob-1, body.lite-mode .ambient-blob-2 { display: none !important; }
        body.lite-mode * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
        body.lite-mode .box, body.lite-mode .stat { background: var(--card-solid) !important; border: 1px solid rgba(255,255,255,0.1) !important; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0 auto; padding: 25px 5%; max-width: 1100px; position: relative; overflow-x: hidden; box-sizing: border-box; }
        *, *::before, *::after { box-sizing: border-box; }

        .ambient-blob-1 { position: fixed; width: 400px; height: 400px; background: rgba(239, 68, 68, 0.08); border-radius: 50%; top: -10%; left: -10%; filter: blur(100px); animation: floatBlob 15s infinite alternate ease-in-out; z-index: -1; pointer-events: none; }
        .ambient-blob-2 { position: fixed; width: 300px; height: 300px; background: rgba(13, 148, 136, 0.12); border-radius: 50%; bottom: -10%; right: -10%; filter: blur(80px); animation: floatBlob 18s infinite alternate-reverse ease-in-out; z-index: -1; pointer-events: none; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 50px) scale(1.1); } }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 10px 18px; background: rgba(255,255,255,0.05); color: var(--text-main); text-decoration: none; border-radius: 12px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-back svg { width: 16px; height: 16px; fill: currentColor; transition: transform 0.3s; }
        .btn-back:hover { background: var(--primary-glow); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow); }
        .btn-back:hover svg { transform: translateX(-4px); }

        h2 { font-weight: 800; margin: 0 0 5px 0; color: var(--text-main); display: flex; align-items: center; gap: 10px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        h2 svg { width: 26px; height: 26px; fill: var(--danger); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.5)); flex-shrink: 0; }
        .sub-title { color: var(--text-sub); margin: 0 0 30px 0; font-size: 13px; line-height: 1.5; }
        .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); animation: pulse 2s infinite; margin-right: 6px; vertical-align: middle; }
        .live-dot.off { background: var(--text-sub); animation: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat { background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px 20px; }
        .stat-value { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; line-height: 1; }
        .stat-title { color: var(--text-sub); font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin: 0; }

        .box { background: var(--card-bg); backdrop-filter: blur(20px); padding: 25px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .toolbar input, .toolbar select { flex: 1 1 200px; min-width: 0; padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 13px; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif; }
        .toolbar select { flex: 0 1 200px; cursor: pointer; }
        .toolbar select option { background: var(--card-solid); color: var(--text-main); }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .day-label { font-size: 11px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; margin: 22px 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .day-label:first-child { margin-top: 0; }
        .day-label::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

        .log-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 14px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px; transition: 0.2s; }
        .log-item:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
        .log-avatar { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; text-transform: uppercase; }
        .log-body { flex: 1; min-width: 0; }
        .log-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 5px; }
        .log-user { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
        .log-time { margin-left: auto; font-size: 11px; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
        .log-action { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin: 0; overflow-wrap: anywhere; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 50px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid; white-space: nowrap; }
        .tone-owner { background: rgba(245, 158, 11, 0.12); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .tone-partner { background: rgba(16, 185, 129, 0.12); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .tone-reseller { background: rgba(13, 148, 136, 0.12); color: #2dd4bf; border-color: rgba(13, 148, 136, 0.3); }
        .tone-other { background: rgba(148, 163, 184, 0.1); color: var(--text-sub); border-color: rgba(148, 163, 184, 0.25); }
        .tone-danger { color: var(--danger) !important; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 13px; }
        .core-spinner { width: 34px; height: 34px; margin: 0 auto 15px auto; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .btn-more { display: block; width: 100%; margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.03); color: var(--text-sub); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.3s; font-family: 'Inter', sans-serif; }
        .btn-more:hover { color: var(--text-main); border-color: var(--primary); background: var(--primary-glow); }

        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            h2 { font-size: 18px; }
            .box { padding: 16px; border-radius: 16px; }
            .log-item { padding: 12px; gap: 10px; }
            .log-avatar { width: 32px; height: 32px; border-radius: 10px; font-size: 12px; }
            .log-time { margin-left: 0; width: 100%; }
            .toolbar select { flex: 1 1 100%; }
        }
        .btn-clear-all { flex: 0 0 auto; padding: 12px 16px; background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: .2s; }
        .btn-clear-all:hover { background: var(--danger); color: #fff; }
        .btn-clear-all:disabled { opacity: .4; cursor: not-allowed; }
        .log-del { margin-left: 8px; background: none; border: none; color: var(--text-sub); font-size: 14px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
        .log-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
        @media (max-width: 600px) { .btn-clear-all { flex: 1 1 100%; } }
    </style>
</head>
<body>
    <script src="page-loader.js"></script>
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>

    <a href="index.html" class="btn-back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Kembali ke Dashboard
    </a>

    <h2>
        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        Log Audit Sistem
    </h2>
    <p class="sub-title"><span class="live-dot off" id="liveDot"></span><span id="liveText">Menghubungkan ke basis data...</span></p>

    <div class="stats">
        <div class="stat"><p class="stat-value" id="statTotal">-</p><p class="stat-title">Log Dimuat</p></div>
        <div class="stat"><p class="stat-value" id="statToday" style="color: var(--primary);">-</p><p class="stat-title">Aktivitas Hari Ini</p></div>
        <div class="stat"><p class="stat-value" id="statUsers" style="color: var(--success);">-</p><p class="stat-title">Entitas Unik</p></div>
        <div class="stat"><p class="stat-value" id="statDanger" style="color: var(--danger);">-</p><p class="stat-title">Aksi Destruktif</p></div>
    </div>

    <div class="box">
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Cari username atau aktivitas..." autocomplete="off">
            <select id="roleFilter"><option value="">Semua Role</option></select>
            <button class="btn-clear-all" id="btnHapusSemuaLog" hidden onclick="hapusSemuaLog()">Hapus Semua Log</button>
        </div>
        <div id="logList"><div class="empty-state"><div class="core-spinner"></div>Memuat log aktivitas...</div></div>
        <button class="btn-more" id="btnMore" hidden onclick="muatLebih()">Muat Lebih Banyak</button>
    </div>

    <script src="config.js"></script>
    <script src="ui-confirm.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        if(localStorage.getItem('lite_mode') === 'true') {
            document.body.classList.add('lite-mode');
        }

        // Validasi Akses: menu ini hanya tampil untuk Pemilik & Demo di dashboard
        const currentUserId = localStorage.getItem('panel_user_id') || localStorage.getItem('user_id') || localStorage.getItem('user_id_ptero');
        const role = String(localStorage.getItem('role') || localStorage.getItem('panel_role') || '').trim().toLowerCase();
        let aksesDitolak = false;
        if (!currentUserId) { aksesDitolak = true; window.location.replace('login.html'); }
        else if (role !== 'pemilik' && role !== 'demo') {
            aksesDitolak = true;
            beritahu({ judul: 'Akses ditolak', pesan: 'Log audit hanya dapat diakses oleh Administrator.', tipe: 'error' })
                .then(() => window.location.replace('index.html'));
        }

        // Hanya pemilik yang boleh menghapus log. Demo hanya melihat.
        const isOwner = role === 'pemilik';
        const username = localStorage.getItem('username') || localStorage.getItem('panel_username') || 'Admin';
        if (isOwner) document.getElementById('btnHapusSemuaLog').hidden = false;

        const ROLE_LABELS = { pemilik:'Administrator', partner_public:'Partner Public', partner_public_v2:'Partner Public V2', reseller_private:'Reseller Private', reseller_public:'Reseller Public', reseller_public_v2:'Reseller Public V2', reseller:'Reseller', demo:'Sesi Demo' };
        const DANGER_WORDS = /hapus|cabut|purge|musnah|suspend|tarik|terminasi|delete|gagal|ditolak/i;
        const PAGE_SIZE = 200;
        let limit = PAGE_SIZE;
        let logs = [];
        let logRef = null;

        function getRoleLabel(roleKey){ return ROLE_LABELS[roleKey] || String(roleKey || '-').replace(/_/g,' ').toUpperCase(); }
        function escapeHtml(value){ return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        function roleTone(r){ r = String(r || ''); if (r === 'pemilik') return 'tone-owner'; if (r.startsWith('partner')) return 'tone-partner'; if (r.startsWith('reseller')) return 'tone-reseller'; return 'tone-other'; }
        function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
        function dayLabel(ts){
            const today = new Date(); const yesterday = new Date(Date.now() - 86400000);
            if (dayKey(ts) === dayKey(today)) return 'Hari Ini';
            if (dayKey(ts) === dayKey(yesterday)) return 'Kemarin';
            return new Date(ts).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function render() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const rf = document.getElementById('roleFilter').value;
            const rows = logs.filter(l => (!rf || l.role === rf) && (!q || (String(l.username || '') + ' ' + String(l.action || '')).toLowerCase().includes(q)));

            const todayKey = dayKey(Date.now());
            document.getElementById('statTotal').innerText = logs.length;
            document.getElementById('statToday').innerText = logs.filter(l => dayKey(l.timestamp) === todayKey).length;
            document.getElementById('statUsers').innerText = new Set(logs.map(l => l.username)).size;
            document.getElementById('statDanger').innerText = logs.filter(l => DANGER_WORDS.test(l.action || '')).length;

            const list = document.getElementById('logList');
            if (!rows.length) {
                list.innerHTML = `<div class="empty-state">${logs.length ? 'Tidak ada log yang cocok dengan filter.' : 'Belum ada aktivitas yang tercatat.'}</div>`;
                return;
            }

            let html = '', lastDay = '';
            rows.forEach(l => {
                const k = dayKey(l.timestamp);
                if (k !== lastDay) { html += `<div class="day-label">${escapeHtml(dayLabel(l.timestamp))}</div>`; lastDay = k; }
                const tone = roleTone(l.role);
                const isDanger = DANGER_WORDS.test(l.action || '');
                const time = new Date(l.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                html += `<div class="log-item">
                    <div class="log-avatar badge ${tone}">${escapeHtml(String(l.username || '?').charAt(0))}</div>
                    <div class="log-body">
                        <div class="log-head">
                            <span class="log-user">${escapeHtml(l.username || 'Unknown')}</span>
                            <span class="badge ${tone}">${escapeHtml(getRoleLabel(l.role))}</span>
                            <span class="log-time">${time}</span>
                            ${isOwner ? `<button class="log-del" title="Hapus log ini" onclick="hapusLog('${escapeHtml(l.id)}')">✕</button>` : ''}
                        </div>
                        <p class="log-action${isDanger ? ' tone-danger' : ''}">${escapeHtml(l.action || '-')}</p>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function refreshRoleFilter() {
            const sel = document.getElementById('roleFilter');
            const current = sel.value;
            const roles = [...new Set(logs.map(l => l.role).filter(Boolean))].sort();
            sel.innerHTML = '<option value="">Semua Role</option>' + roles.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(getRoleLabel(r))}</option>`).join('');
            if (roles.includes(current)) sel.value = current;
        }

        function setLive(on, text) {
            document.getElementById('liveDot').classList.toggle('off', !on);
            document.getElementById('liveText').innerText = text;
        }

        const firebaseConfig = { databaseURL: GlobalConfig.getFirebaseUrl() };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function subscribe() {
            if (logRef) logRef.off();
            logRef = database.ref('activity_logs').orderByChild('timestamp').limitToLast(limit);
            logRef.on('value', snap => {
                const data = snap.val() || {};
                logs = Object.entries(data).map(([id, l]) => ({ id, ...(l || {}), timestamp: Number((l || {}).timestamp || 0) }))
                    .sort((a, b) => b.timestamp - a.timestamp);
                document.getElementById('btnMore').hidden = logs.length < limit;
                setLive(true, `Pemantauan real-time aktif — menampilkan ${logs.length} aktivitas terbaru.`);
                refreshRoleFilter();
                render();
            }, err => {
                setLive(false, 'Koneksi ke basis data gagal.');
                document.getElementById('logList').innerHTML = `<div class="empty-state tone-danger">Gagal memuat log: ${escapeHtml(err && err.message)}</div>`;
            });
        }

        function muatLebih() { limit += PAGE_SIZE; subscribe(); }

        // ==========================================
        // HAPUS LOG (pemilik saja). Setiap penghapusan dicatat sebagai log baru.
        // ==========================================
        function catatAudit(action) {
            return database.ref('activity_logs').push({ uid: currentUserId, username, role, action, timestamp: Date.now() });
        }

        async function hapusLog(id) {
            if (!isOwner) return;
            const l = logs.find(x => x.id === id);
            if (!l) return;
            const ya = await konfirmasi({
                judul: 'Hapus log audit?',
                pesan: `"${l.action || '-'}"\noleh ${l.username || '-'}\n\nTindakan ini tidak bisa dibatalkan.`,
                label: 'Ya, hapus'
            });
            if (!ya) return;
            try {
                await database.ref('activity_logs/' + id).remove();
                await catatAudit(`Menghapus 1 log audit: "${String(l.action || '-').slice(0, 80)}" (oleh ${l.username || '-'})`);
            } catch (e) {
                beritahu({ judul: 'Gagal menghapus', pesan: e.message, tipe: 'error' });
            }
        }

        async function hapusSemuaLog() {
            if (!isOwner) return;
            const btn = document.getElementById('btnHapusSemuaLog');
            try {
                // Ambil seluruh log (bukan hanya yang tampil) untuk cadangan
                const snap = await database.ref('activity_logs').once('value');
                const data = snap.val() || {};
                const jumlah = Object.keys(data).length;
                if (!jumlah) return beritahu({ judul: 'Tidak ada log', pesan: 'Log audit sudah kosong.', tipe: 'info' });

                const ya = await konfirmasi({
                    judul: 'Hapus SEMUA log audit?',
                    pesan: `${jumlah} entri akan dihapus permanen.\n\nCadangan JSON akan diunduh otomatis sebelum dihapus. Tindakan ini tidak bisa dibatalkan.`,
                    label: 'Ya, hapus semua'
                });
                if (!ya) return;

                // Cadangan dulu, baru hapus
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `log-audit-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                btn.disabled = true;
                await database.ref('activity_logs').remove();
                await catatAudit(`Menghapus semua log audit (${jumlah} entri). Cadangan JSON diunduh oleh ${username}.`);
                beritahu({ judul: 'Log dihapus', pesan: `${jumlah} entri telah dihapus.\nCadangan JSON sudah diunduh.`, tipe: 'success' });
            } catch (e) {
                beritahu({ judul: 'Gagal menghapus', pesan: e.message, tipe: 'error' });
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('roleFilter').addEventListener('change', render);
        if (!aksesDitolak) subscribe(); // jangan baca data kalau akses ditolak
    </script>
</body>
</html>
