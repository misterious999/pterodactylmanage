<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Cosmic Squircle Fill -->
    <linearGradient id="zxBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c152c"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>

    <!-- Holographic Outer Border Gradient -->
    <linearGradient id="zxBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Top Blade Gradient (Luminous Teal to Sky Azure) -->
    <linearGradient id="zxTop" x1="16" y1="17" x2="47" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bottom Blade Gradient (Electric Indigo to Vivid Pink) -->
    <linearGradient id="zxBot" x1="17" y1="26" x2="48" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Center Core Glow -->
    <radialGradient id="zxCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="zxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Emblem -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#zxBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#zxBorder)" stroke-width="1.6"/>

  <!-- Ambient Backdrop Bloom -->
  <circle cx="32" cy="32" r="16" fill="#5eead4" opacity="0.08" filter="url(#zxGlow)"/>

  <!-- Top Blade -->
  <path d="M 19 17.5 H 43 C 45.8 17.5 47.8 19.5 47.2 22.3 L 31.2 38.3 C 30.5 39 29.5 39.4 28.5 39.4 H 24.5 C 23.3 39.4 22.6 38.1 23.3 37.1 L 37.8 24.5 H 19 C 17.3 24.5 16 23.2 16 21.5 V 20.5 C 16 18.8 17.3 17.5 19 17.5 Z" 
        fill="url(#zxTop)" filter="url(#zxGlow)"/>

  <!-- Bottom Blade (Rotated 180° around (32, 32)) -->
  <path d="M 45 46.5 H 21 C 18.2 46.5 16.2 44.5 16.8 41.7 L 32.8 25.7 C 33.5 25 34.5 24.6 35.5 24.6 H 39.5 C 40.7 24.6 41.4 25.9 40.7 26.9 L 26.2 39.5 H 45 C 46.7 39.5 48 40.8 48 42.5 V 43.5 C 48 45.2 46.7 46.5 45 46.5 Z" 
        fill="url(#zxBot)" filter="url(#zxGlow)"/>

  <!-- Quantum Core Pulse (Center Spark) -->
  <circle cx="32" cy="32" r="2.2" fill="url(#zxCoreGlow)"/>
</svg>
