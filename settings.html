<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Sistem - Panel Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #0f172a; --card-bg: #1e293b; --primary: #0d9488; 
            --primary-glow: rgba(13, 148, 136, 0.15); --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --text-main: #f8fafc; --text-sub: #94a3b8; --border-color: rgba(255,255,255,0.08); 
        }
        body { font-family: 'Inter', sans-serif; padding: 30px 5%; background-color: var(--bg-color); color: var(--text-main); margin: 0; max-width: 900px; margin: auto; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 10px 18px; background: var(--primary-glow); color: var(--primary); text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid rgba(13, 148, 136, 0.3); transition: 0.3s; }
        .btn-back:hover { background: var(--primary); color: white; }
        h2 { font-weight: 800; margin-bottom: 5px; border-left: 4px solid var(--primary); padding-left: 12px; display: flex; align-items: center; gap: 10px; font-size: 22px; text-transform: uppercase; }
        .sub-title { color: var(--text-sub); margin-bottom: 30px; font-size: 14px; }
        .box { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .box h3 { margin-top: 0; color: var(--primary); font-size: 16px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; margin-bottom: 18px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; }
        .btn-save { width: 100%; background: linear-gradient(135deg, var(--primary), #059669); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 5px 15px var(--primary-glow); }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4); }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Kembali ke Dashboard</a>
    
    <h2>⚙️ Pusat Pengaturan Sistem</h2>
    <p class="sub-title">Kelola koneksi API Pterodactyl, Worker, Firebase, serta parameter default server dalam satu panel.</p>

    <div class="box">
        <h3>🌐 Konfigurasi Jaringan & Database</h3>
        <label>URL Worker CORS</label>
        <input type="text" id="cfgWorker" placeholder="https://...workers.dev/?">
        
        <label>Firebase Database URL</label>
        <input type="text" id="cfgFirebase" placeholder="https://...firebaseio.com">
    </div>

    <div class="box">
        <h3>🔒 Kredensial Pterodactyl Panel</h3>
        <div class="grid-2">
            <div>
                <label>Domain Private Pterodactyl</label>
                <input type="text" id="prvtDomain" placeholder="privateserver.com">
                <label>API Key (PTLA) Private</label>
                <input type="text" id="prvtApi" placeholder="ptla_...">
            </div>
            <div>
                <label>Domain Public Pterodactyl</label>
                <input type="text" id="pubDomain" placeholder="publicserver.com">
                <label>API Key (PTLA) Public</label>
                <input type="text" id="pubApi" placeholder="ptla_...">
            </div>
        </div>
    </div>

    <div class="box">
        <h3>🚀 Parameter Default Deploy (Egg, Location, Node)</h3>
        <div class="grid-2">
            <div>
                <label>Default Location ID</label>
                <input type="number" id="defLocId" placeholder="1">
                
                <label>Default Egg ID</label>
                <input type="number" id="defEggId" placeholder="15">
            </div>
            <div>
                <label>Default Nest ID</label>
                <input type="number" id="defNestId" placeholder="5">
                
                <label>Default Node ID (Opsional)</label>
                <input type="number" id="defNodeId" placeholder="1">
            </div>
        </div>
    </div>

    <button class="btn-save" onclick="simpanPengaturan()">Simpan Seluruh Pengaturan</button>

    <script src="config.js"></script>
    <script>
        // Validasi Akses Pemilik
        const role = (localStorage.getItem('role') || localStorage.getItem('panel_role') || '').trim().toLowerCase();
        if (role !== 'pemilik') {
            alert("Akses ditolak! Halaman ini khusus Pemilik.");
            window.location.replace('index.html');
        }

        // Muat data saat halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cfgWorker').value = localStorage.getItem('cfg_worker_url') || "https://restless-truth-9b75.amisterious09.workers.dev/?";
            document.getElementById('cfgFirebase').value = localStorage.getItem('cfg_firebase_url') || "https://cobaaja-ac5d0-default-rtdb.firebaseio.com";
            
            document.getElementById('prvtDomain').value = localStorage.getItem('prvt_domain') || "privateserverzeroix.bypstar7.web.id";
            document.getElementById('prvtApi').value = localStorage.getItem('prvt_api') || "ptla_FN9WdJ1WzLH1BlGyzyeoWtZGDl9roNeAd8VVmz7g5tF";
            
            document.getElementById('pubDomain').value = localStorage.getItem('pub_domain') || "assistantzeroix.bypstar7.online";
            document.getElementById('pubApi').value = localStorage.getItem('pub_api') || "ptla_WlmF4CJ2yI68CQEKcFeDieij2gXE67CESbqGISbXOeB";

            document.getElementById('defLocId').value = localStorage.getItem('default_loc_id') || "1";
            document.getElementById('defEggId').value = localStorage.getItem('default_egg_id') || "15";
            document.getElementById('defNestId').value = localStorage.getItem('default_nest_id') || "5";
            document.getElementById('defNodeId').value = localStorage.getItem('default_node_id') || "1";
        });

        function simpanPengaturan() {
            localStorage.setItem('cfg_worker_url', document.getElementById('cfgWorker').value.trim());
            localStorage.setItem('cfg_firebase_url', document.getElementById('cfgFirebase').value.trim());
            
            localStorage.setItem('prvt_domain', document.getElementById('prvtDomain').value.trim());
            localStorage.setItem('prvt_api', document.getElementById('prvtApi').value.trim());
            
            localStorage.setItem('pub_domain', document.getElementById('pubDomain').value.trim());
            localStorage.setItem('pub_api', document.getElementById('pubApi').value.trim());

            localStorage.setItem('default_loc_id', document.getElementById('defLocId').value.trim());
            localStorage.setItem('default_egg_id', document.getElementById('defEggId').value.trim());
            localStorage.setItem('default_nest_id', document.getElementById('defNestId').value.trim());
            localStorage.setItem('default_node_id', document.getElementById('defNodeId').value.trim());

            alert("✅ Pengaturan berhasil disimpan dan langsung diterapkan ke seluruh sistem!");
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
